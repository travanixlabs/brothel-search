name: Daily Digest

on:
  schedule:
    - cron: '0 23 * * *'  # 9am AEST
  workflow_dispatch:

env:
  WORKER_URL: https://brothel-search-sync.travanixlabs.workers.dev

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily digest emails
        run: curl -sf -X POST "$WORKER_URL/send-digest" --max-time 120 || echo "⚠ digest failed"
