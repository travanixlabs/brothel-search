name = "brothel-search-sync"
main = "index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 8 * * *", "0 14 * * *", "0 20 * * *", "0 2 * * *", "0 22 * * *"]  # 7pm AEDT (sync), 1am AEDT (sync), 7am AEDT (sync), 1pm AEDT (sync), 9am AEDT (digest)

# Secrets (set via dashboard or `wrangler secret put`):
#   GITHUB_TOKEN  - GitHub personal access token (contents read/write scope)
