name = "brothel-search-sync"
main = "index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 21 * * *", "0 7 * * *", "30 21 * * *", "30 7 * * *", "0 22 * * *"]  # 8am AEDT (girls), 6pm AEDT (girls), 8:30am AEDT (roster), 6:30pm AEDT (roster), 9am AEDT (digest)

# Secrets (set via dashboard or `wrangler secret put`):
#   GITHUB_TOKEN  - GitHub personal access token (contents read/write scope)
